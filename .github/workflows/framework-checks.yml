name: 框架检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 配置 Windows 测试解释器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cgsGitRoot = Split-Path (Split-Path (Split-Path (git --exec-path)))
          "CGS_TEST_BASH=$(Join-Path $cgsGitRoot 'bin/bash.exe')" >> $env:GITHUB_ENV
          "CGS_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: 配置 Linux 测试解释器
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CGS_TEST_BASH=$(command -v bash)" >> "$GITHUB_ENV"
          echo "CGS_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: 安装框架开发检查依赖
        run: python -m pip install --disable-pip-version-check -r studio-tests/requirements.txt
      - name: 自动化行为与迁移检查
        run: python -m unittest discover -s studio-tests/automated -p 'test_*.py' -v
      - name: YAML 与 Skill 元数据完整语法
        run: python studio-tests/validate-yaml.py
      - name: 完整阶段校验
        run: python .agents/scripts/validate-framework.py --scope all --stage complete --format json
      - name: Bash 语法
        shell: bash
        run: |
          find .agents/scripts .codex/hooks -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do bash -n "$file"; done
      - name: 差异格式
        run: git diff --check
